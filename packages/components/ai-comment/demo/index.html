<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C04 standalone demo</title><body style="max-width:720px;margin:40px auto;padding:16px;font:18px system-ui;background:#faf7ee"><h1>C04 isolated component</h1><p>Local synthetic fixtures only, no network or provider requests.</p><sd-ai-comment></sd-ai-comment><pre id="events" aria-live="polite"></pre><script type="module">import '../dist/sd-ai-comment.js';const e=document.querySelector('sd-ai-comment');e.i18n={"search": "Search scenarios", "empty": "Nothing to show", "you": "You", "ai": "StoryDuett AI", "serious": "Serious", "ironic": "Ironic", "custom": "Your own answer", "hint": "Up to 600 characters. Use the submit button.", "send": "Continue", "busy": "Generating\u2026", "original": "Original answer", "correction": "Language feedback", "coaching": "Coaching", "neutral": "Comment"};e.comment={kind:'ironic',text:'A perfectly ordinary talking door.'};e.context='I ask the door.';for(const name of ["sd:comment-expand"])e.addEventListener(name,event=>{document.querySelector('#events').textContent=JSON.stringify(event.detail);});</script></body></html>
