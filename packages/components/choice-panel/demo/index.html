<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C03 standalone demo</title><body style="max-width:720px;margin:40px auto;padding:16px;font:18px system-ui;background:#faf7ee"><h1>C03 isolated component</h1><p>Local synthetic fixtures only, no network or provider requests.</p><div style="display:flex;gap:10px;margin:12px 0"><button id="btn-busy" type="button">Toggle busy</button><button id="btn-disabled" type="button">Toggle disabled</button></div><sd-choice-panel></sd-choice-panel><pre id="events" aria-live="polite"></pre><script type="module">import '../dist/sd-choice-panel.js';const e=document.querySelector('sd-choice-panel');e.i18n={"search": "Search scenarios", "empty": "Nothing to show", "you": "You", "ai": "StoryDuett AI", "serious": "Serious", "ironic": "Ironic", "custom": "Your own answer", "hint": "Up to 600 characters. Use the submit button.", "send": "Continue", "busy": "Generating\u2026", "original": "Original answer", "correction": "Language feedback", "coaching": "Coaching", "neutral": "Comment"};e.allowCustom=true;e.question={id:'q1',text:'Where next?',options:[{id:'a',text:'The garden',tone:'serious'},{id:'b',text:'The library',tone:'serious'},{id:'c',text:'Ask the door for directions',tone:'ironic'}]};document.querySelector('#btn-busy').addEventListener('click',()=>{e.busy=!e.busy;});document.querySelector('#btn-disabled').addEventListener('click',()=>{e.disabled=!e.disabled;});for(const name of ["sd:answer-submit"])e.addEventListener(name,event=>{document.querySelector('#events').textContent=JSON.stringify(event.detail);});</script></body></html>
