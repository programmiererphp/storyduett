<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C02 standalone demo</title><body style="max-width:720px;margin:40px auto;padding:16px;font:18px system-ui;background:#faf7ee"><h1>C02 isolated component</h1><p>Local synthetic fixtures only, no network or provider requests.</p><sd-story-reader></sd-story-reader><pre id="events" aria-live="polite"></pre><script type="module">import '../dist/sd-story-reader.js';const e=document.querySelector('sd-story-reader');e.i18n={"search": "Search scenarios", "empty": "Nothing to show", "you": "You", "ai": "StoryDuett AI", "serious": "Serious", "ironic": "Ironic", "custom": "Your own answer", "hint": "Up to 600 characters. Use the submit button.", "send": "Continue", "busy": "Generating\u2026", "original": "Original answer", "correction": "Language feedback", "coaching": "Coaching", "neutral": "Comment"};e.segments=[{id:'s1',turnId:'n1',text:'An old door opens.',kind:'opening',actorId:'ai'},{id:'s2',turnId:'n2',text:'You enter the garden.',kind:'user-contribution',actorId:'solo'}];e.activeNodeId='n2';for(const name of ["sd:segment-select"])e.addEventListener(name,event=>{document.querySelector('#events').textContent=JSON.stringify(event.detail);});</script></body></html>
