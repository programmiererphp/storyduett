<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C01 standalone demo</title><body style="max-width:720px;margin:40px auto;padding:16px;font:18px system-ui;background:#faf7ee"><h1>C01 isolated component</h1><p>Local synthetic fixtures only, no network or provider requests.</p><sd-usecase-picker></sd-usecase-picker><pre id="events" aria-live="polite"></pre><script type="module">import '../dist/sd-usecase-picker.js';const e=document.querySelector('sd-usecase-picker');e.i18n={"search": "Search scenarios", "empty": "Nothing to show", "you": "You", "ai": "StoryDuett AI", "serious": "Serious", "ironic": "Ironic", "custom": "Your own answer", "hint": "Up to 600 characters. Use the submit button.", "send": "Continue", "busy": "Generating\u2026", "original": "Original answer", "correction": "Language feedback", "coaching": "Coaching", "neutral": "Comment"};e.useCases=[{id:'fiction',name:'Fiction',summary:'Choose an adventure',language:'de'}];for(const name of ["sd:usecase-select"])e.addEventListener(name,event=>{document.querySelector('#events').textContent=JSON.stringify(event.detail);});</script></body></html>
